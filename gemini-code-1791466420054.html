<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALTIJD ONDERWEG - Homepage Prototype</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Impact', 'Arial Black', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* Flitsend achtergrondeffect */
    .flash-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s ease;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 90vw;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .sketch-slide {
      position: absolute;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.08s ease, transform 0.08s ease;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .sketch-slide.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Stijlen geïnspireerd door de diverse schetsen */
    
    /* Layout 1: Eén lange regel */
    .style-1 {
      font-size: 5vw;
      letter-spacing: 15px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    /* Layout 2: Enkel ONDERWEG x2 */
    .style-2 {
      font-size: 8vw;
      color: #ff0055;
      transform: skewX(-10deg);
    }

    /* Layout 3: Stapel ALTIJD / ONDERWEG met omlijnde tekst */
    .style-3 {
      font-size: 9vw;
      color: transparent;
      -webkit-text-stroke: 2px #00e5ff;
    }

    /* Layout 4: Klassiek blok */
    .style-4 {
      font-size: 10vw;
      color: #ffe600;
      text-shadow: 5px 5px 0px #ff0055;
    }

    /* Layout 5: Speels/handgeschreven gevoel */
    .style-5 {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 7vw;
      text-transform: none;
      color: #00ff66;
    }

    /* Layout 6: Enkel ONDERWEG mega groot */
    .style-6 {
      font-size: 13vw;
      letter-spacing: -5px;
      color: #ffffff;
      background: linear-gradient(180deg, #fff, #444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Layout 7 & 8: Variaties in spelling/stijl (Altyd / Alijd) */
    .style-7 {
      font-size: 9vw;
      color: #ff3300;
      transform: rotate(-3deg);
    }

    .style-8 {
      font-size: 9vw;
      color: #ffffff;
      filter: drop-shadow(0 0 10px #00e5ff);
      transform: rotate(3deg);
    }

    /* Instructieknop onderin */
    .controls {
      position: absolute;
      bottom: 30px;
      z-index: 10;
      display: flex;
      gap: 15px;
    }

    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 20px;
      cursor: pointer;
      font-family: sans-serif;
      font-size: 14px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="flash-bg" id="flash"></div>

  <div class="container">
    <!-- Schets 1 -->
    <div class="sketch-slide style-1 active">
      <div>ALTIJD ONDERWEG</div>
    </div>

    <!-- Schets 2 -->
    <div class="sketch-slide style-2">
      <div>ONDERWEG</div>
      <div>ONDERWEG</div>
    </div>

    <!-- Schets 3 -->
    <div class="sketch-slide style-3">
      <div>ALTIJD</div>
      <div>ONDERWEG</div>
    </div>

    <!-- Schets 4 -->
    <div class="sketch-slide style-4">
      <div>ALTIJD</div>
      <div>ONDERWEG</div>
    </div>

    <!-- Schets 5 -->
    <div class="sketch-slide style-5">
      <div>Altijd</div>
      <div>ONDERWEG</div>
    </div>

    <!-- Schets 6 -->
    <div class="sketch-slide style-6">
      <div>ONDERWEG</div>
    </div>

    <!-- Schets 7 -->
    <div class="sketch-slide style-7">
      <div>Altyd</div>
      <div>ONDERWEG</div>
    </div>

    <!-- Schets 8 -->
    <div class="sketch-slide style-8">
      <div>Alijd</div>
      <div>ONDERWEG</div>
    </div>
  </div>

  <div class="controls">
    <button id="toggleSpeed">Snelheid: Snel</button>
  </div>

  <script>
    const slides = document.querySelectorAll('.sketch-slide');
    const flash = document.getElementById('flash');
    const toggleBtn = document.getElementById('toggleSpeed');

    let currentIndex = 0;
    let intervalId = null;
    let speed = 180; // Snelheid in milliseconden (flitsend effect)

    function showNextSlide() {
      // Verberg huidige slide
      slides[currentIndex].classList.remove('active');

      // Kies een willekeurige of opeenvolgende slide
      currentIndex = (currentIndex + 1) % slides.length;

      // Activeer de nieuwe slide
      slides[currentIndex].classList.add('active');

      // Witte flits-animatie op willekeurige momenten
      if (Math.random() > 0.6) {
        flash.style.opacity = '0.25';
        setTimeout(() => {
          flash.style.opacity = '0';
        }, 40);
      }
    }

    function startAnimation() {
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(showNextSlide, speed);
    }

    // Wisselen tussen heel snel en rustiger
    toggleBtn.addEventListener('click', () => {
      if (speed === 180) {
        speed = 500;
        toggleBtn.textContent = 'Snelheid: Rustig';
      } else if (speed === 500) {
        speed = 90;
        toggleBtn.textContent = 'Snelheid: Ultra Flitsend';
      } else {
        speed = 180;
        toggleBtn.textContent = 'Snelheid: Snel';
      }
      startAnimation();
    });

    // Start direct
    startAnimation();
  </script>
</body>
</html>
